[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-run"
version = "0.1.8"
description = "A Python library for running commands with time, output, and process-tree limits."
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["bounded_run"]
