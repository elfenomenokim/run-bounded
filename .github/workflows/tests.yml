name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test Rust CLI
        run: |
          # tests/cli.rs is gated with #![cfg(unix)], so on Windows cargo test verifies compilation only.
          # --test-threads=1 keeps the timing-sensitive process-group tests from contending on 2-core runners.
          cargo build --locked
          cargo test --locked -- --test-threads=1
      - name: Test Python library (Unix)
        if: runner.os != 'Windows'
        run: python tests/test_python.py
      - name: Test Python library (Windows)
        if: runner.os == 'Windows'
        run: |
          # test_stdin_closed_by_default_and_input_or_inherit hardcodes /bin/cat and /usr/bin/true,
          # so it and the POSIX process-group tests are left out on Windows.
          python -m unittest tests.test_python.OptionsAndCapsTest.test_cwd_sets_working_directory tests.test_python.OptionsAndCapsTest.test_separate_stdout_and_stderr_caps tests.test_python.OptionsAndCapsTest.test_kill_on_cap_reports_output_limit_even_if_child_exits_immediately
